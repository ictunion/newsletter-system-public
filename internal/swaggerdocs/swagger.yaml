basePath: /api
definitions:
  handler.auditLogItem:
    properties:
      action:
        type: string
      actor_email:
        type: string
      actor_sub:
        type: string
      category:
        type: string
      created_at:
        type: string
      id:
        format: uuid
        type: string
      method:
        type: string
      path:
        type: string
      route:
        type: string
      status_code:
        type: integer
    type: object
  handler.auditLogsResponse:
    properties:
      limit:
        type: integer
      logs:
        items:
          $ref: '#/definitions/handler.auditLogItem'
        type: array
      offset:
        type: integer
      total:
        type: integer
    type: object
  handler.createMemberRequest:
    properties:
      city:
        type: string
      email:
        type: string
      first_name:
        type: string
      lang:
        type: string
      last_name:
        type: string
      member_number:
        type: integer
      workplace_newsletter_id:
        description: 'orca''s workplaces.newsletter_id: the Listmonk ID of the workplace
          list.'
        type: integer
    type: object
  handler.jobItem:
    properties:
      attempt_count:
        type: integer
      created_at:
        type: string
      id:
        format: uuid
        type: string
      kind:
        enum:
        - push_subscriber
        - delete_subscriber
        type: string
      last_error:
        type: string
      listmonk_subscriber_id:
        type: integer
      next_attempt_at:
        type: string
      status:
        enum:
        - pending
        - dead
        type: string
      subscriber_email:
        description: The push job's subscriber, for display; null for delete jobs.
        type: string
      subscriber_id:
        format: uuid
        type: string
      subscriber_member_number:
        type: integer
      updated_at:
        type: string
    type: object
  handler.jobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/handler.jobItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  handler.listItem:
    properties:
      deleted_at:
        format: date-time
        type: string
      description:
        type: string
      id:
        format: uuid
        type: string
      listmonk_id:
        type: integer
      listmonk_subscriber_count:
        type: integer
      name:
        type: string
      removed_count:
        type: integer
      subscribed_count:
        type: integer
      synced_at:
        format: date-time
        type: string
      unsubscribed_count:
        type: integer
      visibility:
        type: string
    type: object
  handler.listSubscriberItem:
    properties:
      created_at:
        type: string
      email:
        type: string
      listmonk_status:
        type: string
      member_number:
        type: integer
      name:
        type: string
      rule_id:
        format: uuid
        type: string
      source:
        enum:
        - rule
        - workplace
        - manual
        - self
        type: string
      status:
        enum:
        - subscribed
        - unsubscribed
        - removed
        type: string
      subscriber_id:
        format: uuid
        type: string
      updated_at:
        type: string
    type: object
  handler.listSubscribersResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      subscribers:
        items:
          $ref: '#/definitions/handler.listSubscriberItem'
        type: array
      total:
        type: integer
    type: object
  handler.listsResponse:
    properties:
      lists:
        items:
          $ref: '#/definitions/handler.listItem'
        type: array
    type: object
  handler.memberFieldsRequest:
    properties:
      city:
        type: string
      email:
        type: string
      first_name:
        type: string
      lang:
        type: string
      last_name:
        type: string
      workplace_newsletter_id:
        description: 'orca''s workplaces.newsletter_id: the Listmonk ID of the workplace
          list.'
        type: integer
    type: object
  handler.memberResponse:
    properties:
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        format: uuid
        type: string
      lang:
        type: string
      last_name:
        type: string
      listmonk_subscriber_id:
        type: integer
      member_number:
        type: integer
      name:
        type: string
      subscriptions:
        items:
          $ref: '#/definitions/handler.subscriptionItem'
        type: array
      unmatched_workplace_newsletter_id:
        description: |-
          Set when workplace_newsletter_id matches no active list; the other
          lists are still applied.
        type: integer
      updated_at:
        type: string
    type: object
  handler.ruleItem:
    properties:
      city_contains:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        format: uuid
        type: string
      kind:
        enum:
        - all
        - city
        type: string
      list_id:
        format: uuid
        type: string
      note:
        type: string
    type: object
  handler.ruleRequest:
    properties:
      city_contains:
        description: Required for kind city, must be empty for kind all.
        type: string
      enabled:
        description: Defaults to true.
        type: boolean
      kind:
        enum:
        - all
        - city
        type: string
      list_id:
        format: uuid
        type: string
      note:
        type: string
    type: object
  handler.rulesResponse:
    properties:
      rules:
        items:
          $ref: '#/definitions/handler.ruleItem'
        type: array
    type: object
  handler.subscriberResponse:
    properties:
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        format: uuid
        type: string
      lang:
        type: string
      last_name:
        type: string
      listmonk_subscriber_id:
        type: integer
      member_number:
        type: integer
      name:
        type: string
      subscriptions:
        items:
          $ref: '#/definitions/handler.subscriptionItem'
        type: array
      updated_at:
        type: string
    type: object
  handler.subscriptionItem:
    properties:
      created_at:
        type: string
      list_deleted_at:
        format: date-time
        type: string
      list_id:
        format: uuid
        type: string
      list_name:
        type: string
      listmonk_id:
        type: integer
      listmonk_status:
        type: string
      rule_id:
        format: uuid
        type: string
      source:
        enum:
        - rule
        - workplace
        - manual
        - self
        type: string
      status:
        enum:
        - subscribed
        - unsubscribed
        - removed
        type: string
      updated_at:
        type: string
    type: object
  handler.syncRunItem:
    properties:
      changes_detected:
        type: integer
      error:
        type: string
      finished_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      items_fetched:
        type: integer
      kind:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
  handler.syncRunsResponse:
    properties:
      runs:
        items:
          $ref: '#/definitions/handler.syncRunItem'
        type: array
    type: object
  handler.updateListRequest:
    properties:
      visibility:
        enum:
        - private
        - members
        - public
        type: string
    type: object
info:
  contact: {}
  description: 'Newsletter System API. Dev-only documentation (see config.EnableSwaggerDocs):
    every route below requires a Keycloak bearer token unless noted otherwise.'
  title: Newsletter System API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Requires the view-audit-logs role. One entry per authenticated
        POST/PUT/PATCH/DELETE request (who, what, when), newest first. status_code
        is the response status — rejected attempts are included, filter to 2xx client-side
        for changes that took effect.
      parameters:
      - description: One of handler.AuditCategories
        in: query
        name: category
        type: string
      - description: Keycloak subject of the caller
        in: query
        name: actor_sub
        type: string
      - description: YYYY-MM-DD, inclusive
        in: query
        name: from
        type: string
      - description: YYYY-MM-DD, inclusive
        in: query
        name: to
        type: string
      - description: Max results, default 100, capped at 500
        in: query
        name: limit
        type: integer
      - description: Default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.auditLogsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List audit log
      tags:
      - audit-logs
  /jobs:
    get:
      description: Requires the view-newsletters role. Jobs that push our state to
        Listmonk, newest first. A job is deleted once it succeeds; a dead one gave
        up after 10 attempts and waits for a retry.
      parameters:
      - description: Only this status
        enum:
        - pending
        - dead
        in: query
        name: status
        type: string
      - description: Max results, default 100, capped at 500
        in: query
        name: limit
        type: integer
      - description: Default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.jobsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List provider jobs
      tags:
      - jobs
  /jobs/{id}/retry:
    post:
      description: Requires the manage-newsletters role. Puts a dead job back in the
        queue, due now, with a fresh attempt count, and returns it. 409 when the job
        is not dead.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.jobItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retry a dead job
      tags:
      - jobs
  /lists:
    get:
      description: Requires the view-newsletters role. Every list with its visibility,
        our subscription count per status, and Listmonk's own subscriber count, ordered
        by name. Soft-deleted lists only with include_deleted=true.
      parameters:
      - description: Include soft-deleted lists
        in: query
        name: include_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List newsletter lists
      tags:
      - lists
  /lists/{id}:
    put:
      consumes:
      - application/json
      description: Requires the manage-newsletters role. Returns the updated list.
      parameters:
      - description: List ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New visibility
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change list visibility
      tags:
      - lists
  /lists/{id}/members/{member_number}:
    delete:
      description: Requires the manage-newsletters role. Sets the member's subscription
        to removed. Rules and the workplace never re-add a removed subscription. A
        member who is not subscribed is left as is. 404 for an unknown member or list.
      parameters:
      - description: List ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Member number
        in: path
        name: member_number
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove a member from a list
      tags:
      - lists
    put:
      description: 'Requires the manage-newsletters role. Subscribes the member to
        the list as a manual subscription, or re-adds them after an admin removal,
        and returns the member. 409 when the member unsubscribed from the list themselves:
        only they can undo that. 404 for an unknown member or a missing or deleted
        list.'
      parameters:
      - description: List ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Member number
        in: path
        name: member_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.subscriberResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a member to a list
      tags:
      - lists
  /lists/{id}/subscribers:
    get:
      description: Requires the view-newsletters role. The list's subscriptions with
        their subscriber, by name.
      parameters:
      - description: List ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Only this status
        enum:
        - subscribed
        - unsubscribed
        - removed
        in: query
        name: status
        type: string
      - description: Max results, default 100, capped at 500
        in: query
        name: limit
        type: integer
      - description: Default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.listSubscribersResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a list's subscribers
      tags:
      - lists
  /members:
    post:
      consumes:
      - application/json
      description: 'Requires the update-newsletter-members role. Called by orca right
        after it accepts a member. Idempotent: an existing member_number answers 200
        with the current state and changes nothing. An email held by a non-member
        subscriber attaches the member to that subscriber. Puts the member on the
        lists of every matching rule and on their workplace list.'
      parameters:
      - description: Member
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.memberResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.memberResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a member
      tags:
      - members
  /members/{member_number}:
    delete:
      description: Requires the update-newsletter-members or manage-newsletters role.
        Hard-deletes the member and their subscriptions, and deletes them from Listmonk
        in the background. 204 also when the member does not exist.
      parameters:
      - description: Member number
        in: path
        name: member_number
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a member
      tags:
      - members
    get:
      description: Requires the view-newsletters role. The member's data and every
        subscription with its status, source, rule and last seen Listmonk status.
      parameters:
      - description: Member number
        in: path
        name: member_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.subscriberResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a member
      tags:
      - members
    put:
      consumes:
      - application/json
      description: Requires the update-newsletter-members role. Called by orca when
        a member's workplace, city, email, name or lang change. Updates the member
        and their rule and workplace lists, and returns the updated member. 409 when
        another subscriber has the email.
      parameters:
      - description: Member number
        in: path
        name: member_number
        required: true
        type: integer
      - description: Member data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.memberFieldsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.memberResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a member
      tags:
      - members
  /rules:
    get:
      description: 'Requires the view-newsletters role. Every rule, oldest first.
        Rules put members on lists: kind all matches every member, kind city matches
        members whose city contains city_contains (case- and accent-insensitive).
        Every matching enabled rule applies.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.rulesResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List subscription rules
      tags:
      - rules
    post:
      consumes:
      - application/json
      description: 'Requires the manage-newsletters role. Existing members are not
        re-evaluated here: the daily orca reconciliation proposes the resulting subscription
        changes.'
      parameters:
      - description: Rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ruleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ruleItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a subscription rule
      tags:
      - rules
  /rules/{id}:
    delete:
      description: Requires the manage-newsletters role. Subscriptions the rule created
        stay; their rule_id becomes null.
      parameters:
      - description: Rule ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a subscription rule
      tags:
      - rules
    put:
      consumes:
      - application/json
      description: 'Requires the manage-newsletters role. Replaces every field and
        returns the updated rule. Existing members are not re-evaluated here: the
        daily orca reconciliation proposes the resulting subscription changes.'
      parameters:
      - description: Rule ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Rule
        in: body
